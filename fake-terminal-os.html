<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUVADI-OS v1.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --crt-black:#050a06;
  --crt-black-2:#081206;
  --crt-green:#42ff77;
  --crt-green-dim:#1f7a3d;
  --crt-green-faint:#0f4020;
  --crt-amber:#ffb000;
  --scanline-op:0.06;
}

*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0;
  height:100%;
  background:#000;
  overflow:hidden;
}
body{
  font-family:'VT323', monospace;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ---------- CRT shell ---------- */
.crt{
  position:relative;
  width:min(1000px, 96vw);
  height:min(680px, 92vh);
  background:radial-gradient(ellipse at center, var(--crt-black-2) 0%, var(--crt-black) 100%);
  border-radius:22px;
  box-shadow:
    0 0 0 10px #0a0a0a,
    0 0 0 12px #1a1a1a,
    0 30px 80px rgba(0,0,0,0.7),
    inset 0 0 60px rgba(0,0,0,0.6),
    0 0 40px rgba(66,255,119,0.15);
  overflow:hidden;
  animation:powerOn 1.1s ease-out;
}

@keyframes powerOn{
  0%{ filter:brightness(0) contrast(2); transform:scaleY(0.02); }
  6%{ filter:brightness(3) contrast(3); transform:scaleY(1); }
  10%{ filter:brightness(0.4); }
  14%{ filter:brightness(2); }
  18%{ filter:brightness(1); }
  100%{ filter:brightness(1); transform:scaleY(1); }
}

/* scanlines */
.crt::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,var(--scanline-op)) 0px,
    rgba(0,0,0,var(--scanline-op)) 1px,
    transparent 2px,
    transparent 3px
  );
  z-index:5;
  mix-blend-mode:multiply;
}

/* vignette + curvature illusion */
.crt::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  z-index:6;
}

/* flicker */
.screen{
  position:relative;
  width:100%;
  height:100%;
  padding:28px 32px;
  overflow-y:auto;
  color:var(--crt-green);
  text-shadow:0 0 4px rgba(66,255,119,0.7), 0 0 12px rgba(66,255,119,0.25);
  animation:flicker 6s infinite;
}
@keyframes flicker{
  0%,96%,100%{ opacity:1; }
  97%{ opacity:0.94; }
  98%{ opacity:1; }
  99%{ opacity:0.97; }
}

.screen::-webkit-scrollbar{ width:0; }

@media (prefers-reduced-motion:reduce){
  .crt{ animation:none; }
  .screen{ animation:none; }
}

/* ---------- text content ---------- */
.line{
  font-size:19px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
  min-height:1.5em;
}
.line.dim{ color:var(--crt-green-dim); }
.line.amber{ color:var(--crt-amber); text-shadow:0 0 4px rgba(255,176,0,0.6); }
.line.prompt-line{ display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }

.ascii{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  line-height:1.15;
  color:var(--crt-green);
  white-space:pre;
  margin:6px 0 14px;
}

.prompt-tag{
  color:var(--crt-green-dim);
  flex-shrink:0;
}
.prompt-tag .user{ color:var(--crt-amber); }

#inputRow{
  display:flex;
  align-items:baseline;
  gap:8px;
  font-size:19px;
}
#cmdInput{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:var(--crt-green);
  font-family:'VT323', monospace;
  font-size:19px;
  text-shadow:0 0 4px rgba(66,255,119,0.7);
  caret-color:transparent;
}

.cursor{
  display:inline-block;
  width:9px;
  height:19px;
  background:var(--crt-green);
  box-shadow:0 0 6px rgba(66,255,119,0.8);
  animation:blink 1s steps(1) infinite;
  transform:translateY(3px);
}
@keyframes blink{
  0%,49%{ opacity:1; }
  50%,100%{ opacity:0; }
}

#anchor{ height:1px; }

/* matrix overlay */
#matrixCanvas{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
}
.matrix-hint{
  position:absolute;
  bottom:14px;
  left:0; right:0;
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--crt-green-dim);
  z-index:21;
  display:none;
}
</style>
</head>
<body>

<div class="crt">
  <div class="screen" id="screen">
    <div id="output"></div>
    <div id="inputRow">
      <span class="prompt-tag"><span class="user">guest</span>@suvadi-os:<span id="pwdDisplay">~</span>$</span>
      <span id="typedEcho"></span><span class="cursor" id="cursor"></span>
      <input id="cmdInput" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    </div>
    <div id="anchor"></div>
  </div>
  <canvas id="matrixCanvas"></canvas>
  <div class="matrix-hint" id="matrixHint">press any key to return</div>
</div>

<script>
(function(){
  const output = document.getElementById('output');
  const screen = document.getElementById('screen');
  const input = document.getElementById('cmdInput');
  const typedEcho = document.getElementById('typedEcho');
  const pwdDisplay = document.getElementById('pwdDisplay');
  const anchor = document.getElementById('anchor');

  /* ---------------- virtual filesystem ---------------- */
  const fs = {
    type:'dir',
    name:'/',
    children:{
      home:{ type:'dir', name:'home', children:{
        guest:{ type:'dir', name:'guest', children:{
          'welcome.txt':{ type:'file', content:
`Welcome to SUVADI-OS.
This machine runs on nothing but vibes and vintage phosphor.
Type 'help' if you're lost. Type 'ls' if you're curious.` },
          'readme.txt':{ type:'file', content:
`This "OS" is a single HTML file pretending very hard to be a computer.
No servers were harmed. No data leaves this tab.` }
        }}
      }},
      jokes:{ type:'dir', name:'jokes', children:{
        'dad_jokes.txt':{ type:'file', content:
`Why do programmers prefer dark mode?
Because light attracts bugs.

I told my computer I needed a break.
Now it won't stop sending me KitKats.

Why did the design system go to therapy?
Too many unresolved tokens.` },
        'programmer_jokes.txt':{ type:'file', content:
`There are 10 types of people in the world:
those who understand binary, and those who don't.

A SQL query walks into a bar, walks up to two tables and asks,
"Can I join you?"

99 little bugs in the code, 99 little bugs.
Take one down, patch it around,
127 little bugs in the code.` }
      }},
      secrets:{ type:'dir', name:'secrets', children:{
        'truth.txt':{ type:'file', content:
`You've been staring at a fake terminal for entertainment.
No judgment. It's a good terminal.` }
      }},
      '.hidden':{ type:'dir', name:'.hidden', children:{
        'you_found_me.txt':{ type:'file', content:
`Most people never run 'ls -a'.
You did. Here's a cookie: 🍪` }
      }},
      'fortune.txt':{ type:'file', content:
`The fortunes live inside the 'fortune' command, not this file.
Nice try though.` }
    }
  };

  const FORTUNES = [
    "A bug you don't understand today will explain itself at 2am.",
    "The next commit message you write will say 'fix typo'. It will not fix the typo.",
    "Someone, somewhere, is about to reinvent your CSS reset.",
    "Your next great idea will arrive during a shower, not a meeting.",
    "A design review is coming. Bring snacks, not just Figma links.",
    "The cache you forget to clear will remember everything.",
    "Somewhere a semicolon is missing and nobody knows yet.",
    "You will open twelve tabs to solve one problem, and close none of them.",
    "The README you skip today will be the README you desperately need in six months.",
    "A stray console.log will outlive the feature it was debugging."
  ];

  /* ---------------- path state ---------------- */
  let cwdPath = ['home','guest'];

  function resolveDir(pathArr){
    let node = fs;
    for(const seg of pathArr){
      if(!node.children || !node.children[seg] || node.children[seg].type !== 'dir') return null;
      node = node.children[seg];
    }
    return node;
  }

  function pwdString(){
    return '~' + (cwdPath.length > 2 ? '/' + cwdPath.slice(2).join('/') : (cwdPath.length === 2 ? '' : '/' + cwdPath.join('/')));
  }

  /* ---------------- output helpers ---------------- */
  function printLine(text, cls){
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    output.appendChild(div);
  }
  function printAscii(text){
    const pre = document.createElement('div');
    pre.className = 'ascii';
    pre.textContent = text;
    output.appendChild(pre);
  }
  function printPromptEcho(cmd){
    const div = document.createElement('div');
    div.className = 'line prompt-line';
    const tag = document.createElement('span');
    tag.className = 'prompt-tag';
    tag.innerHTML = `<span class="user">guest</span>@suvadi-os:${pwdString()}$`;
    const cmdSpan = document.createElement('span');
    cmdSpan.textContent = cmd;
    div.appendChild(tag);
    div.appendChild(cmdSpan);
    output.appendChild(div);
  }
  function scrollDown(){
    requestAnimationFrame(()=>{ anchor.scrollIntoView({block:'end'}); });
  }

  /* ---------------- commands ---------------- */
  const commandHistory = [];
  let historyIdx = -1;

  const HELP_TEXT =
`Available commands:

  help              show this list
  ls [-a] [path]    list directory contents
  cd [path]         change directory (try 'cd ..' or 'cd ~')
  cat <file>        print a file's contents
  fortune           receive a piece of unsolicited wisdom
  neofetch          show fake system info
  whoami            find out who you are (probably)
  date              show the current date and time
  echo <text>       repeat text back at you
  history           show command history
  clear             clear the screen
  matrix            you know what this does
  sudo <anything>   try it
  exit              attempt to leave`;

  function neofetchText(){
    const now = new Date();
    return (
`        .-\"\"\"-.        guest@suvadi-os
      .'       '.      -----------------
     /   O   O   \\     OS:      SUVADI-OS v1.0
    :    \\_^_/    :    Host:    Single HTML File
     \\           /     Kernel:  vanilla-js 0.0.1
      '.       .'      Uptime:  ${Math.floor(performance.now()/1000)}s
        '-...-'        Shell:   fake-sh
                        Terminal: CRT (phosphor green)
                        Local time: ${now.toLocaleTimeString()}`
    );
  }

  function listDir(node, showHidden){
    const keys = Object.keys(node.children || {}).filter(k => showHidden || !k.startsWith('.'));
    if(keys.length === 0) return '(empty)';
    return keys.map(k=>{
      const child = node.children[k];
      return child.type === 'dir' ? k + '/' : k;
    }).join('   ');
  }

  function runCommand(raw){
    const trimmed = raw.trim();
    if(trimmed.length === 0) return;

    commandHistory.push(trimmed);
    historyIdx = commandHistory.length;

    printPromptEcho(trimmed);

    const parts = trimmed.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);

    switch(cmd){
      case 'help':
        printLine(HELP_TEXT);
        break;

      case 'ls': {
        let showHidden = false;
        let pathArg = null;
        args.forEach(a=>{
          if(a === '-a') showHidden = true;
          else pathArg = a;
        });
        let targetPath = cwdPath;
        if(pathArg){
          targetPath = pathArg === '~' ? ['home','guest'] :
            pathArg.startsWith('/') ? pathArg.split('/').filter(Boolean) :
            [...cwdPath, ...pathArg.split('/').filter(Boolean)];
        }
        const node = resolveDir(targetPath);
        if(!node){ printLine(`ls: cannot access '${pathArg}': No such directory`, 'amber'); break; }
        printLine(listDir(node, showHidden), 'dim');
        break;
      }

      case 'cd': {
        if(args.length === 0 || args[0] === '~'){ cwdPath = ['home','guest']; break; }
        if(args[0] === '..'){
          if(cwdPath.length > 0) cwdPath.pop();
          break;
        }
        const rel = args[0].startsWith('/') ? args[0].split('/').filter(Boolean) : [...cwdPath, ...args[0].split('/').filter(Boolean)];
        const node = resolveDir(rel);
        if(!node){ printLine(`cd: no such directory: ${args[0]}`, 'amber'); break; }
        cwdPath = rel;
        break;
      }

      case 'cat': {
        if(args.length === 0){ printLine('cat: missing file operand', 'amber'); break; }
        const fname = args[0];
        const dirNode = resolveDir(cwdPath);
        const fileNode = dirNode && dirNode.children ? dirNode.children[fname] : null;
        if(!fileNode || fileNode.type !== 'file'){ printLine(`cat: ${fname}: No such file`, 'amber'); break; }
        printLine(fileNode.content);
        break;
      }

      case 'fortune':
        printLine(FORTUNES[Math.floor(Math.random()*FORTUNES.length)], 'dim');
        break;

      case 'neofetch':
        printAscii(neofetchText());
        break;

      case 'whoami':
        printLine("guest — probably someone who should be doing something else right now.");
        break;

      case 'date':
        printLine(new Date().toString());
        break;

      case 'echo':
        printLine(args.join(' '));
        break;

      case 'history':
        if(commandHistory.length <= 1){ printLine('(no history yet)', 'dim'); break; }
        printLine(commandHistory.slice(0, -1).map((c,i)=>`  ${i+1}  ${c}`).join('\n'), 'dim');
        break;

      case 'clear':
        output.innerHTML = '';
        break;

      case 'matrix':
        enterMatrix();
        break;

      case 'sudo':
        printLine('Nice try. This user has no power here. (Also there is no root. There was never a root.)', 'amber');
        break;

      case 'exit':
        printLine('There is no exit. This is a browser tab.', 'amber');
        printLine('(You could close the tab, but where would that leave the terminal?)', 'dim');
        break;

      default:
        printLine(`command not found: ${cmd} — type 'help' for a list of things that do work`, 'amber');
    }

    pwdDisplay.textContent = pwdString();
    scrollDown();
  }

  /* ---------------- boot sequence ---------------- */
  const BOOT_LOGO =
`  ███████╗██╗   ██╗██╗   ██╗ █████╗ ██████╗ ██╗
  ██╔════╝██║   ██║██║   ██║██╔══██╗██╔══██╗██║
  ███████╗██║   ██║██║   ██║███████║██║  ██║██║
  ╚════██║██║   ██║╚██╗ ██╔╝██╔══██║██║  ██║██║
  ███████║╚██████╔╝ ╚████╔╝ ██║  ██║██████╔╝██║
  ╚══════╝ ╚═════╝   ╚═══╝  ╚═╝  ╚═╝╚═════╝ ╚═╝
              O  S     v 1 . 0`;

  const BOOT_LINES = [
    '[ ok ] initializing phosphor array...',
    '[ ok ] warming CRT tube...',
    '[ ok ] mounting /home/guest...',
    '[ ok ] loading fortune database (10 entries)...',
    '[ ok ] calibrating scanlines...',
    ' '
  ];

  async function typeLine(text, cls, speed){
    return new Promise(resolve=>{
      const div = document.createElement('div');
      div.className = 'line' + (cls ? ' ' + cls : '');
      output.appendChild(div);
      let i = 0;
      const iv = setInterval(()=>{
        div.textContent = text.slice(0, i+1);
        i++;
        scrollDown();
        if(i >= text.length){ clearInterval(iv); resolve(); }
      }, speed || 6);
    });
  }

  async function boot(){
    input.disabled = true;
    printAscii(BOOT_LOGO);
    for(const l of BOOT_LINES){
      await typeLine(l, 'dim', 4);
      await sleep(70);
    }
    await typeLine("Type 'help' to see what this thing can do.", null, 8);
    printLine(' ');
    input.disabled = false;
    input.focus();
    pwdDisplay.textContent = pwdString();
  }

  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

  /* ---------------- input handling ---------------- */
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      const val = input.value;
      input.value = '';
      typedEcho.textContent = '';
      runCommand(val);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(commandHistory.length === 0) return;
      historyIdx = Math.max(0, historyIdx - 1);
      input.value = commandHistory[historyIdx] || '';
      typedEcho.textContent = input.value;
    } else if(e.key === 'ArrowDown'){
      e.preventDefault();
      historyIdx = Math.min(commandHistory.length, historyIdx + 1);
      input.value = commandHistory[historyIdx] || '';
      typedEcho.textContent = input.value;
    }
  });
  input.addEventListener('input', ()=>{ typedEcho.textContent = input.value; });

  screen.addEventListener('click', ()=> input.focus());

  /* ---------------- matrix easter egg ---------------- */
  const matrixCanvas = document.getElementById('matrixCanvas');
  const matrixHint = document.getElementById('matrixHint');
  let matrixActive = false;
  let matrixInterval = null;

  function enterMatrix(){
    matrixActive = true;
    const crt = document.querySelector('.crt');
    matrixCanvas.width = crt.clientWidth;
    matrixCanvas.height = crt.clientHeight;
    matrixCanvas.style.display = 'block';
    matrixHint.style.display = 'block';
    input.blur();

    const ctx = matrixCanvas.getContext('2d');
    const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789';
    const fontSize = 15;
    const columns = Math.floor(matrixCanvas.width / fontSize);
    const drops = new Array(columns).fill(1);

    matrixInterval = setInterval(()=>{
      ctx.fillStyle = 'rgba(5,10,6,0.12)';
      ctx.fillRect(0,0,matrixCanvas.width, matrixCanvas.height);
      ctx.fillStyle = '#42ff77';
      ctx.font = fontSize + 'px monospace';
      for(let i=0;i<drops.length;i++){
        const text = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        if(drops[i]*fontSize > matrixCanvas.height && Math.random() > 0.975){
          drops[i] = 0;
        }
        drops[i]++;
      }
    }, 45);

    function exitMatrix(){
      matrixActive = false;
      clearInterval(matrixInterval);
      matrixCanvas.style.display = 'none';
      matrixHint.style.display = 'none';
      document.removeEventListener('keydown', exitHandler);
      matrixCanvas.removeEventListener('click', exitMatrix);
      input.focus();
    }
    function exitHandler(){ if(matrixActive) exitMatrix(); }
    document.addEventListener('keydown', exitHandler);
    matrixCanvas.addEventListener('click', exitMatrix);
  }

  boot();
})();
</script>

</body>
</html>
